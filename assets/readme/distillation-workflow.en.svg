<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">From source material to a complete target Skill capability</title>
  <desc id="workflow-desc">Text, existing Skills, repositories, and experience are distilled into judgment, workflow, runtime resources, and acceptance boundaries, connected to a target Skill, then verified through official producers and consumers.</desc>

  <defs>
    <marker id="workflow-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7D8997"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="28"
        fill="#0B1118" stroke="#263340" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="68" fill="#F3EFE7" font-size="38" font-weight="760">
      From source material to a complete target Skill capability
    </text>
    <text x="56" y="105" fill="#98A3B3" font-size="18" font-weight="520">
      Keep the judgment, workflow, and resources that produce results; leave one-off cases in the current task
    </text>

    <g id="source-stage">
      <rect x="56" y="138" width="270" height="274" rx="22"
            fill="#121B24" stroke="#344351" stroke-width="2"/>
      <text x="80" y="174" fill="#7D8997" font-size="15" font-weight="720"
            letter-spacing="1.6">01 / SOURCE</text>
      <text x="80" y="220" fill="#F3EFE7" font-size="38" font-weight="760">MATERIAL</text>

      <rect x="80" y="246" width="102" height="58" rx="12"
            fill="#18232E" stroke="#344351" stroke-width="2"/>
      <rect x="198" y="246" width="102" height="58" rx="12"
            fill="#18232E" stroke="#344351" stroke-width="2"/>
      <rect x="80" y="320" width="102" height="58" rx="12"
            fill="#18232E" stroke="#344351" stroke-width="2"/>
      <rect x="198" y="320" width="102" height="58" rx="12"
            fill="#18232E" stroke="#344351" stroke-width="2"/>

      <text x="131" y="282" text-anchor="middle" fill="#F3EFE7"
            font-size="18" font-weight="680">TEXT</text>
      <text x="249" y="282" text-anchor="middle" fill="#F3EFE7"
            font-size="18" font-weight="680">SKILL</text>
      <text x="131" y="356" text-anchor="middle" fill="#F3EFE7"
            font-size="18" font-weight="680">REPO</text>
      <text x="249" y="356" text-anchor="middle" fill="#F3EFE7"
            font-size="16" font-weight="680">EXPERIENCE</text>
    </g>

    <path d="M340 275 H391" fill="none" stroke="#7D8997"
          stroke-width="4" stroke-linecap="round" marker-end="url(#workflow-arrow)"/>

    <g id="distillation-stage">
      <rect x="410" y="124" width="365" height="302" rx="24"
            fill="#1A1A19" stroke="#F2B84B" stroke-width="3"/>
      <text x="438" y="164" fill="#F2B84B" font-size="15" font-weight="720"
            letter-spacing="1.6">02 / DISTILL</text>
      <rect x="632" y="142" width="113" height="34" rx="17"
            fill="#332814" stroke="#8B6826" stroke-width="1.5"/>
      <text x="688.5" y="164" text-anchor="middle" fill="#F2B84B"
            font-size="13" font-weight="720">NOT A SUMMARY</text>
      <text x="438" y="216" fill="#F3EFE7" font-size="31" font-weight="760">
        COMPLETE CAPABILITY
      </text>

      <rect x="438" y="244" width="142" height="62" rx="13"
            fill="#24221C" stroke="#8B6826" stroke-width="2"/>
      <rect x="596" y="244" width="142" height="62" rx="13"
            fill="#24221C" stroke="#8B6826" stroke-width="2"/>
      <rect x="438" y="324" width="142" height="62" rx="13"
            fill="#24221C" stroke="#8B6826" stroke-width="2"/>
      <rect x="596" y="324" width="142" height="62" rx="13"
            fill="#24221C" stroke="#8B6826" stroke-width="2"/>

      <text x="509" y="282" text-anchor="middle" fill="#F3EFE7"
            font-size="17" font-weight="680">JUDGMENT</text>
      <text x="667" y="282" text-anchor="middle" fill="#F3EFE7"
            font-size="17" font-weight="680">WORKFLOW</text>
      <text x="509" y="362" text-anchor="middle" fill="#F3EFE7"
            font-size="17" font-weight="680">RESOURCES</text>
      <text x="667" y="362" text-anchor="middle" fill="#F3EFE7"
            font-size="17" font-weight="680">ACCEPTANCE</text>
    </g>

    <path d="M789 275 H831" fill="none" stroke="#7D8997"
          stroke-width="4" stroke-linecap="round" marker-end="url(#workflow-arrow)"/>

    <g id="target-stage">
      <rect x="850" y="138" width="294" height="274" rx="22"
            fill="#101C1C" stroke="#53C6B2" stroke-width="3"/>
      <text x="876" y="174" fill="#53C6B2" font-size="15" font-weight="720"
            letter-spacing="1.6">03 / TARGET</text>
      <text x="876" y="220" fill="#F3EFE7" font-size="34" font-weight="760">
        TARGET SKILL
      </text>

      <rect x="876" y="244" width="242" height="48" rx="11"
            fill="#172925" stroke="#316A61" stroke-width="2"/>
      <rect x="876" y="307" width="242" height="48" rx="11"
            fill="#172925" stroke="#316A61" stroke-width="2"/>
      <rect x="876" y="370" width="242" height="24" rx="12"
            fill="#53C6B2"/>

      <text x="997" y="275" text-anchor="middle" fill="#F3EFE7"
            font-size="18" font-weight="680">SKILL.md ROUTES</text>
      <text x="997" y="338" text-anchor="middle" fill="#F3EFE7"
            font-size="18" font-weight="680">RESOURCE ENTRY</text>
      <text x="997" y="388" text-anchor="middle" fill="#0B1118"
            font-size="15" font-weight="780">READY TO VERIFY</text>
    </g>

    <g id="verification-chain">
      <rect x="56" y="458" width="1088" height="66" rx="18"
            fill="#111B23" stroke="#2B3B49" stroke-width="2"/>
      <circle cx="86" cy="491" r="8" fill="#53C6B2"/>
      <text x="108" y="499" fill="#53C6B2" font-size="17" font-weight="740">
        REAL VALIDATION
      </text>
      <text x="260" y="499" fill="#F3EFE7" font-size="17" font-weight="620">
        OFFICIAL PRODUCER
      </text>
      <text x="433" y="499" fill="#7D8997" font-size="22">→</text>
      <text x="468" y="499" fill="#F3EFE7" font-size="17" font-weight="620">
        TRANSFER / STORE
      </text>
      <text x="623" y="499" fill="#7D8997" font-size="22">→</text>
      <text x="658" y="499" fill="#F3EFE7" font-size="17" font-weight="620">
        OFFICIAL CONSUMER
      </text>
      <text x="842" y="499" fill="#7D8997" font-size="22">→</text>
      <text x="877" y="499" fill="#F3EFE7" font-size="17" font-weight="620">
        USER RESULT
      </text>
    </g>
  </g>
</svg>
